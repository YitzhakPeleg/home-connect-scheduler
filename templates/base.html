<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home Connect Scheduler{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.3.0/sse.js"></script>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>HCS</strong></li>
        </ul>
        <ul>
            <li><a href="/" {% if active_page == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a></li>
            <li><a href="/appliances" {% if active_page == "appliances" %}aria-current="page"{% endif %}>Appliances</a></li>
            <li><a href="/schedules" {% if active_page == "schedules" %}aria-current="page"{% endif %}>Schedules</a></li>
            <li><a href="/history" {% if active_page == "history" %}aria-current="page"{% endif %}>History</a></li>
            <li><a href="/settings" {% if active_page == "settings" %}aria-current="page"{% endif %}>Settings</a></li>
        </ul>
        <ul>
            <li>
                {% if connected %}
                <span class="status-dot connected" title="Connected"></span>
                {% else %}
                <a href="/auth/login" role="button" class="outline">Connect</a>
                {% endif %}
            </li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container">
        <small>Home Connect Scheduler</small>
    </footer>
</body>
</html>
