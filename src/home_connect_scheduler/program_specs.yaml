# Program specifications for Bosch dishwasher (SMS6ZDW48E or similar).
# Data sourced from the Bosch product data sheet (EN 60436) and Home Connect app.
#
# Duration in minutes, energy in kWh, water in litres.
# Key: last segment of the Home Connect API program key.
# Fields with _range show variable programs (e.g. Auto adjusts to load).

Intensiv70:
  name: Intensive 70°C
  duration: 133          # 2:10-2:15 midpoint
  duration_range: "2:10-2:15"
  energy: 1.325
  energy_range: "1.30-1.35"
  water: 10.5
  water_range: "9.0-12.0"

